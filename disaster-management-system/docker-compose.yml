services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/disaster_db
      JWT_SECRET: disaster-platform-super-secret-key-change-in-production-min-32-chars
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      CORS_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost
    depends_on:
      - mongodb

  python-nlp:
    build: ../python-service
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/disaster_db
      SACHET_FEED_URL: ${SACHET_FEED_URL:-https://sachet.ndma.gov.in/cap_public_website/rss/rss_india.xml}
      SACHET_POLL_INTERVAL_SECONDS: ${SACHET_POLL_INTERVAL_SECONDS:-300}
      SACHET_MAX_STORED_ALERTS: ${SACHET_MAX_STORED_ALERTS:-500}
      SACHET_ENABLED: ${SACHET_ENABLED:-true}
      BACKEND_INGEST_URL: http://backend:8080/api/events/ingest
    depends_on:
      - mongodb
      - backend

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:

